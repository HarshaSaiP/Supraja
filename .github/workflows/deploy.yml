name: Deploy Supraja to PythonAnywhere

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supraja-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install Django openpyxl requests
          fi

      - name: Check Django configuration
        env:
          DJANGO_SETTINGS_MODULE: Supraja.settings
        run: python manage.py check

      - name: Deploy to PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_DOMAIN: ${{ secrets.PA_DOMAIN }}
        run: |
          python - <<'PY'
          import os
          import requests

          username = os.environ["PA_USERNAME"]
          token = os.environ["PA_API_TOKEN"]
          domain = os.environ["PA_DOMAIN"]

          base = (
              "https://www.pythonanywhere.com/api/v0/user/"
              + username
          )
          headers = {
              "Authorization": f"Token {token}"
          }

          # Verify that the PythonAnywhere web app exists.
          response = requests.get(
              f"{base}/webapps/{domain}/",
              headers=headers,
              timeout=30,
          )
          response.raise_for_status()

          # Find the existing Bash console.
          response = requests.get(
              f"{base}/consoles/",
              headers=headers,
              timeout=30,
          )
          response.raise_for_status()

          consoles = response.json()
          console = next(
              (
                  item for item in consoles
                  if str(item.get("id")) == "48744124"
              ),
              None,
          )

          if console is None:
              raise RuntimeError(
                  "PythonAnywhere Bash console 48744124 "
                  "was not found."
              )

          # Submit the Git pull command.
          response = requests.post(
              f"{base}/consoles/{console['id']}/send_input/",
              headers=headers,
              data={
                  "input": (
                      "cd /home/Supraja/Supraja && "
                      "git pull --ff-only origin master\n"
                  )
              },
              timeout=30,
          )
          response.raise_for_status()

          print(
              "Git pull command submitted. "
              "Check the PythonAnywhere console to verify "
              "that it completed successfully."
          )

          # Do not reload yet: submitting console input does
          # not prove that git pull has finished.
          print(
              "Code update submitted, but automatic reload "
              "has not been performed. Deployment needs a "
              "reliable completion check before reloading."
          )
          PY
