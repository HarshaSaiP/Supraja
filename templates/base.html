{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Supraja Portal{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'logo.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #15803d;
            --primary-dark: #166534;
            --secondary: #064e3b;
            --bg: #f0fdf4;
            --surface: #ffffff;
            --text: #14532d;
            --text-light: #475569;
            --border: #dcfce7;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .navbar {
            background-color: var(--secondary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            background-color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background-color: var(--surface);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .title-section {
            margin-bottom: 2rem;
        }

        .title-section h2 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .title-section p {
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        .form-control {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--text-light);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }


        /* Tables */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--text-light);
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .total-row {
            background-color: #f1f5f9;
            font-weight: 700;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .navbar h1 {
                font-size: 1.25rem;
            }

            .container {
                margin: 1rem auto;
                padding: 0 1rem;
            }

            .card {
                padding: 1.25rem;
            }

            .title-section h2 {
                font-size: 1.5rem;
            }

            /* Keep table structure but allow horizontal scroll */
            .table-container {
                margin: 0 -1.25rem;
                padding: 0 1.25rem;
                width: calc(100% + 2.5rem);
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            table {
                min-width: 600px; /* Ensure table doesn't get too squashed */
            }

            .btn {
                width: 100%;
                margin-bottom: 0.5rem;
            }

            .nav-link {
                display: block;
                width: 100%;
            }
        }

        /* Grid */
        .grid {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        /* Utility */
        .mt-4 { margin-top: 1rem; }
        .mb-4 { margin-bottom: 1rem; }
        .text-center { text-align: center; }
        .small-note { font-size: 0.75rem; color: var(--text-light); }

        {% block extra_style %}{% endblock %}
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="navbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="{% static 'logo.png' %}" alt="Supraja Logo" style="height: 70px; border-radius: 0.25rem;">
            <h1>{% block nav_title %}Supraja Portal{% endblock %}</h1>
        </div>
        <div class="nav-actions">
            {% block nav_actions %}{% endblock %}
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
